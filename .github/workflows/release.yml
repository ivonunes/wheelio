name: Release

# Run by hand from the Actions tab on main with the version to release. It
# checks the version, runs the CI tests, builds, signs and notarizes, and only
# then commits the version to main, tags it vX.Y.Z and publishes the GitHub
# release. A failure at any step leaves no commit, tag or release behind.
#
# The build and the signing run in separate jobs: the build (Homebrew, Rust,
# crates and their build scripts) never sees a secret, and the signing job
# runs only this repository's scripts and Apple's tools. Actions are pinned to
# full commit SHAs so a moved tag can't change what runs.
#
# Signing/notarization secrets live in the GitHub "release" Environment
# (Settings -> Environments -> release), which only main may deploy to and
# which waits for a reviewer's approval:
#   DEVELOPER_ID_CERT_P12        base64 of the Developer ID Application .p12
#   DEVELOPER_ID_CERT_PASSWORD   password for that .p12
#   CODESIGN_IDENTITY            e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_P8                base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID                the API key ID
#   NOTARY_ISSUER_ID             the API key issuer UUID

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.0.0"
        required: true
        type: string

# Read-only unless a job says otherwise.
permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Run the release from main (this run is on ${GITHUB_REF_NAME})." >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 2.0.0 (no leading v), got '${VERSION}'." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already tagged." >&2
            exit 1
          fi
          current="$(tr -d '[:space:]' < VERSION)"
          if [[ "$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -1)" != "${VERSION}" ]]; then
            echo "::error::${VERSION} is older than the current version ${current}." >&2
            exit 1
          fi

  test:
    name: Test
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (no secrets)
    needs: test
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set the version
        run: ./scripts/set-version.sh "${VERSION}"

      - name: Install build tools
        run: brew install xcodegen mingw-w64   # cmake is preinstalled on the runner

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d  # stable

      - name: Build the VR streamer
        working-directory: streamer
        run: cargo build --release

      - name: Build and stage
        run: ./scripts/release.sh build

      # An app bundle loses its symlinks and permissions in a raw artifact,
      # so it travels as a tarball.
      - name: Pack the unsigned build
        run: tar -czf "${RUNNER_TEMP}/unsigned.tar.gz" -C dist "wheelio-${VERSION}"

      - name: Upload the unsigned build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Sign, notarize & publish
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: unsigned
          path: ${{ runner.temp }}

      - name: Unpack
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xzf "${RUNNER_TEMP}/unsigned.tar.gz" -C dist

      - name: Set up signing keychain
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/developer_id.p12"

          echo "$CERT_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain"
          rm -f "$cert"

      - name: Sign, notarize & package
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CODESIGN_IDENTITY}" || -z "${NOTARY_KEY_ID}" || -z "${NOTARY_ISSUER_ID}" || -z "${NOTARY_KEY_P8}" ]]; then
            echo "::error::Signing/notarization secrets missing from the 'release' environment; refusing to publish an unsigned build." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/notary_key.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key_path"

          CODESIGN_IDENTITY="$CODESIGN_IDENTITY" \
          NOTARY_KEY_PATH="$key_path" \
          NOTARY_KEY_ID="$NOTARY_KEY_ID" \
          NOTARY_ISSUER_ID="$NOTARY_ISSUER_ID" \
          ./scripts/release.sh sign

          rm -f "$key_path"

      # Only now, with a signed and notarized build in hand, does anything
      # reach the repository. The push is atomic: if main moved since the run
      # started, neither the version commit nor the tag lands. The token is
      # handed to this one git command rather than stored in the checkout.
      - name: Commit the version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/set-version.sh "${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- VERSION project.yml; then
            git add VERSION project.yml
            git commit -m "Release ${VERSION}"
          fi
          git tag -a "v${VERSION}" -m "Wheelio ${VERSION}"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64)"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --atomic origin "HEAD:main" "v${VERSION}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "dist/wheelio-${VERSION}.zip" \
            --verify-tag \
            --title "Wheelio ${VERSION}" \
            --generate-notes

      - name: Clean up keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
