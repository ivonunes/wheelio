name: Engine

# Builds the Wine engine when engine/ changes in a pull request, or on demand.
# The tarball is uploaded as an artifact; release-engine.yml reuses this
# workflow to build the engine it publishes.
on:
  pull_request:
    paths:
      - engine/**
      - .github/workflows/engine.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-15
    timeout-minutes: 240
    # engine/build.sh can also target arm64 (WHEELIO_ENGINE_ARCH), but without
    # FEX that engine can't run x86 games yet, so only x86_64 is built here.
    strategy:
      matrix:
        arch: [x86_64]
    env:
      WHEELIO_ENGINE_ARCH: ${{ matrix.arch }}
      WHEELIO_ENGINE_WORK: ${{ github.workspace }}/build/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null
          brew install mingw-w64 bison pkgconf xz meson ninja nasm glslang   # cmake is preinstalled

      # The pinned downloads (CrossOver's 149 MB source release and the rest).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/engine/cache
          key: engine-downloads-${{ hashFiles('engine/UPSTREAM.txt') }}

      # The libraries built before Wine (MoltenVK, GStreamer, DXVK and the
      # rest), which take about half the build; build.sh redoes any whose
      # inputs changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: build/engine/${{ matrix.arch }}/deps
          key: engine-deps-${{ matrix.arch }}-${{ hashFiles('engine/UPSTREAM.txt', 'engine/build.sh', 'engine/patches/*/*.patch') }}

      - name: Build
        run: engine/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheelio-engine-${{ matrix.arch }}
          path: build/engine/wheelio-engine-*-${{ matrix.arch }}.tar.xz
          if-no-files-found: error
          compression-level: 0   # already xz
